[workspace]
resolver = "2"
members = ["src-tauri", "crates/echokey-core", "crates/echokey-audio", "crates/echokey-asr"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Novaire <contact@novairedigital.com>"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
parking_lot = "0.12"
crossbeam-channel = "0.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
