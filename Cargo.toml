[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/parle-core",
    "crates/parle-audio",
    "crates/parle-asr",
    "crates/parle-hook",
    "crates/parle-sync",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Benjamin Jacquet <contact@novairedigital.com>"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
parking_lot = "0.12"
crossbeam-channel = "0.5"

[profile.release]
# "thin" not fat: fat LTO strips clang_rt's ___isPlatformVersionAtLeast that ggml-metal needs
lto = "thin"
codegen-units = 1
strip = true
