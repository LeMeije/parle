[package]
name = "parle-asr"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Parle ASR: engine trait, whisper.cpp backend, model registry, downloader"

[features]
default = ["whisper"]
whisper = ["dep:whisper-rs"]
metal = ["whisper-rs/metal"]
cuda = ["whisper-rs/cuda"]
# Parakeet via the official sherpa-onnx crate. Off by default: its build script
# fetches prebuilt libs unless SHERPA_ONNX_LIB_DIR is set (cache in CI).
parakeet = ["dep:sherpa-onnx", "dep:tar", "dep:bzip2"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
whisper-rs = { version = "0.16", optional = true }
sherpa-onnx = { version = "1.13", optional = true }
tar = { version = "0.4", optional = true }
bzip2 = { version = "0.5", optional = true }
ureq = "2"

[dev-dependencies]
tempfile = "3"

[dev-dependencies.parle-audio]
path = "../parle-audio"
